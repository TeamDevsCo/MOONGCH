spring:
  application:
    name: moongch  # 어플리케이션 이름 설정

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: true

springdoc:
    api-docs:
      path: /api-docs  # api-docs 접근 경로에 대한 별칭, 해당 주소로 접속해도 http://localhost:8080/v3/api-docs로 리다이렉션 됨.
    swagger-ui:
      path: /apis  # swagger-ui 접근 경로에 대한 별칭, 해당 주소로 접속해도 http://localhost:8080/v3/swagger-ui/index.html로 리다이렉션 됨.
      groups-order: DESC # path, query, body, response 순으로 출력
      tags-sorter: alpha # 태그를 알파벳 순으로 정렬
      operations-sorter: method  # delete - get - patch - post - put 순으로 정렬, alpha를 사용하면 알파벳 순으로 정렬 가능
    show-login-endpoint: true
    servers:
      - "https://moongch.com"
      - "http://localhost:8080"
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
