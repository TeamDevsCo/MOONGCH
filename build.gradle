plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.asciidoctor.jvm.convert' version '3.3.2'
	id 'org.ec4j.editorconfig' version '0.1.0'
  id 'checkstyle'
}

group = 'co.devsco'
version = '0.0.1-SNAPSHOT'


java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
}

editorconfig {
	excludes = ['build', 'out', '.idea', 'docker', '.github', 'checkstyle']
}

checkstyle {
  toolVersion = '10.20.2' // Checkstyle 버전
  configFile = file('checkstyle/checkstyle-checker.xml') // 규칙 파일 경로
}

tasks.withType(Checkstyle).configureEach {
  reports {
    xml.required = true // XML 형식의 결과 보고서 활성화
    xml.outputLocation = layout.buildDirectory.file("checkstyle/checkstyle-result.xml") // 출력 경로 설정
    html.required = true // HTML 형식의 보고서 비활성화 (필요 시 true로 설정)
  }
}

check.dependsOn editorconfigCheck // checkstyle이 설정 되어 있을 시, editorconfigCheck 후 checkstyle 진행

// GitHooks 셋업 태스크
tasks.register('installGitHooks', Exec) {
  description = 'Git 훅을 설정합니다'
  group = 'setup'

  doFirst {
    // pre-commit 훅 설정
    def preCommitFile = file("${rootDir}/.githooks/pre-commit")
    if (preCommitFile.exists()) {
      preCommitFile.setExecutable(true)
    } else {
      throw new GradleException("pre-commit 훅 파일이 존재하지 않습니다. .githooks/pre-commit 파일을 생성하세요.")
    }

    // pre-push 훅 설정
    def prePushFile = file("${rootDir}/.githooks/pre-push")
    if (prePushFile.exists()) {
      prePushFile.setExecutable(true)
    } else {
      throw new GradleException("pre-push 훅 파일이 존재하지 않습니다. .githooks/pre-push 파일을 생성하세요.")
    }

  }

  // git config 명령 실행
  commandLine 'git', 'config', 'core.hooksPath', '.githooks'

  doLast {
    println "Git 훅이 성공적으로 설정되었습니다."
  }
}

// 모든 프로젝트에 대한 설정을 적용하기 위해 build 태스크에 의존성 추가
tasks.named('build') {
  dependsOn 'installGitHooks'
}

// 테스트 없이 코드 품질 확인만 수행하는 태스크
tasks.register('checkCodeQuality') {
  description = '테스트 없이 코드 품질 검사만 수행합니다'
  group = 'verification'

  dependsOn 'checkstyleMain', 'checkstyleTest', 'editorconfigCheck'
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.kafka:spring-kafka'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
  implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
  annotationProcessor 'org.projectlombok:lombok'
  compileOnly 'org.projectlombok:lombok'
  runtimeOnly 'com.h2database:h2'
  implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.9.5'
  compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'

  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}
