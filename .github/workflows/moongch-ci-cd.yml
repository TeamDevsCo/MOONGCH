name: moongch-be-app CI/CD

on:
  push:
    branches: [ "develop" ]
    paths-ignore: # 이 경로의 파일들이 변경되면 트리거되지 않음
      - ".github/**"
      - "docs/readme.md"
  pull_request:
    branches: [ "develop" ]
    paths-ignore:
      - ".github/*"
      - "docs/readme.md"
    types: [ opened, synchronize, reopened, closed ] # PR의 상태 변경 이벤트

env:
  REGISTRY: docker.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: ⬆️ Checkout repository # 러너 환경에서 develop 브랜치의 코드를 가져오는 단계
        uses: actions/checkout@v4

      - name: 🔰 Log in to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: ⚙️ Set up QEMU  # 멀티 아키텍쳐 지원 (ARM, x86_)
        uses: docker/setup-buildx-action@v3

      - name: ⚒️ Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:latest

  deploy:
    if: ${{ github.event.pull_request.merged == true && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    environment: dev
    needs: build-and-push-image  # build-and-push-image job이 성공해야만 실행

    steps:
    - name: 🔑 executing remote ssh && deploy with docker-compose
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ vars.FULL_DOMAIN_NAME }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:latest
            cd ${{ secrets.DOCKER_COMPOSE_PATH }}
            docker-compose down
            docker-compose up -d
            docker image prune -f
            docker ps -a
