name: moongch-be-app Build & Push

on:
  workflow_run:
    workflows: [ moongch-be-app Test ] # 테스트 워크플로우
    types: [ completed ] # 테스트가 완료된 후 실행

  workflow_dispatch:
env:
  REGISTRY: docker.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # 테스트 워크 플로우가 성공해야만 수행

    steps:
      - name: ⬆️ Checkout repository # 러너 환경에서 develop 브랜치의 코드를 가져오는 단계
        uses: actions/checkout@v4

      - name: 🔰 Log in to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: ⚙️ Set up QEMU  # 멀티 아키텍쳐 지원 (ARM, x86_)
        uses: docker/setup-buildx-action@v3

      - name: ⚒️ Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:latest
